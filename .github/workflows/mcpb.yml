# Packages the .mcpb bundle. UNTESTED against a real MCPB host; see servers/highered-institutions/testing.md.
name: mcpb
on:
  push:
    tags: ["highered-institutions/v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack servers/highered-institutions highered-institutions.mcpb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: mcpb, path: highered-institutions.mcpb }
