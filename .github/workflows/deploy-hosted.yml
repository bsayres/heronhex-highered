# Rebuilds and redeploys the hosted connector on Fly.io once a week (and on demand), so the image's pre-warmed cache
# of public files stays inside every file's TTL. The build downloads from the public sources on Fly's remote builder;
# nothing is fetched by the running server on a user's behalf unless a file has expired.
# Needs the repository secret FLY_API_TOKEN (a deploy token scoped to the app). Code changes on main do NOT deploy
# automatically; run this workflow by hand after a release you want live.
name: deploy-hosted
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC; off the hour to avoid GitHub's busiest minutes
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-hosted
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --remote-only --config servers/highered-hosted/fly.toml --dockerfile servers/highered-hosted/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
