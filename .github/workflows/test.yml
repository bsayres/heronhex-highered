name: test
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
        server: [highered-institutions, highered-risk, highered-funding, highered-labor-market, highered-accreditation]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --python ${{ matrix.python }} --frozen
      - run: PYTHONPATH=src uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pip-audit --skip-editable
