name: test
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
        server: [highered-institutions, highered-risk]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python ${{ matrix.python }} --frozen
      - run: PYTHONPATH=src uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pip-audit --skip-editable
