name: test
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
        server: [highered-institutions, highered-risk, highered-funding, highered-labor-market, highered-accreditation, highered-hosted]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python ${{ matrix.python }} --frozen
      - run: PYTHONPATH=src uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pip-audit --skip-editable
