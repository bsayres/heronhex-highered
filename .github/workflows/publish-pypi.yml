# Publishes with PyPI Trusted Publishing (OIDC); no token stored. Tag: highered-institutions/v0.1.0
# Setup required once on PyPI: add this repo + workflow filename + environment "pypi" as a trusted publisher.
name: publish-pypi
on:
  push:
    tags: ["highered-institutions/v*", "highered-risk/v*", "highered-funding/v*", "highered-labor-market/v*", "highered-accreditation/v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Build the package named in the tag
        run: |
          server="${GITHUB_REF_NAME%%/*}"
          case "$server" in highered-institutions|highered-risk|highered-funding|highered-labor-market|highered-accreditation) ;; *) echo "unknown server"; exit 1;; esac
          cd "servers/$server" && uv build --out-dir "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
